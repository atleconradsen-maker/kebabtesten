<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legg inn test – Kebabtesten</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#17110e;--panel:#241a15;--panel2:#1d1511;--line:#3d2c22;--line2:#2f221b;--text:#fff4e0;--muted:#c4ad94;--dim:#957d66;--sauce:#e8402a;--sauce2:#ff5a3c;--gold:#ffc629}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  .disp{font-family:'Archivo Black',Impact,sans-serif;font-weight:400}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:20px}
  header{display:flex;align-items:center;gap:12px}
  .back{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);text-decoration:none;flex:0 0 auto}
  header h1{margin:0;font-size:24px;flex:1}
  .lbl{font-size:12px;font-weight:800;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;margin-bottom:7px;display:block}
  input[type=text],input[type=number],input[type=date],input[type=password],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
  input:focus,textarea:focus{outline:2px solid var(--sauce);outline-offset:0;border-color:transparent}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .row2>label{min-width:0;display:block}
  input[type=text],input[type=number],input[type=date],input[type=password]{height:50px;min-width:0;display:block}
  input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;line-height:1.2}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  .pills.even .pill{flex:1}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
  .pill.on{border-color:var(--sauce);background:rgba(255,106,43,.14);color:#ff9a6a}
  .chili{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 8px}
  .chili button{width:40px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
  .card h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--sauce2)}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .photo{position:relative;border:1.5px dashed #4a3a30;background:var(--panel2);border-radius:16px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;overflow:hidden}
  .photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;z-index:2;cursor:pointer}
  .tester{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
  .th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .th b{font-size:17px}
  .th .tot{font-family:'Archivo Black';font-size:26px;color:var(--sauce2)}
  .rm{background:none;border:0;color:var(--dim);font-size:13px;cursor:pointer;padding:8px}
  .sub{font-size:11px;font-weight:800;letter-spacing:1.1px;color:var(--muted);margin:10px 0 0}
  .step{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2)}
  .step:last-of-type{border-bottom:0}
  .step span{font-weight:600}
  .step .ctl{display:flex;align-items:center;gap:6px}
  .step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
  .step output{width:34px;text-align:center;font-family:'Archivo Black';font-size:21px;color:var(--gold)}
  .step output.empty{color:var(--dim)}
  .sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
  .sum b{color:var(--text)}
  .add{display:flex;gap:8px}
  .add input{flex:1}
  .add button{flex:0 0 auto;padding:0 18px;border-radius:12px;border:1px solid var(--sauce);background:transparent;color:var(--sauce2);font-weight:800;cursor:pointer}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick button{font-size:14px;font-weight:800;padding:10px 14px;border-radius:999px;border:1.5px solid var(--gold);background:rgba(255,198,41,.08);color:var(--gold);cursor:pointer;min-height:44px}
  .empty-t{border:1.5px dashed var(--gold);display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);line-height:1.45}
  .empty-t b{color:var(--text);font-size:16px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px 18px}
  .bar .in{max-width:560px;margin:0 auto}
  .save{width:100%;padding:17px;border-radius:999px;border:0;background:var(--sauce);color:var(--bg);font-weight:800;font-size:17px;cursor:pointer}
  .save:disabled{opacity:.6;cursor:default}
  .msg{padding:13px 15px;border-radius:12px;font-size:14px;line-height:1.45}
  .msg.err{background:#3d1f1c;color:#ffb0a6}
  .msg.ok{background:#1f3322;color:#a8eaa3}
  .msg.info{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .msg a{color:inherit;font-weight:800}
  .hidden{display:none!important}
  .ac{position:relative}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#2a1e18;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:12px 14px;cursor:pointer;color:var(--text)}
  .sugg button:first-child{border-top:0}
  .sugg button:hover,.sugg button:focus{background:rgba(255,198,41,.08);outline:none}
  .sugg b{display:block;font-size:15px}
  .sugg small{color:var(--muted);font-size:12px}
  .pinfo{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.45}
  .pinfo.known{background:#1f3322;color:#a8eaa3}
  .pinfo.warn{background:#3a2a10;color:#ffd27a}
  .pinfo.new{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .pinfo .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .pinfo .btns button{padding:9px 13px;border-radius:999px;border:1px solid currentColor;background:none;color:inherit;font-weight:800;font-size:13px;cursor:pointer;min-height:40px}
  .pinfo .btns button.pri{background:var(--gold);border-color:var(--gold);color:#17110e}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  .at{margin-top:12px;padding:12px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .at.warn{background:#3a2a10;border-color:#5a4318;color:#ffd27a}
  .at p{margin:0 0 8px;font-size:13px;color:inherit}
  .at .chips{display:flex;flex-wrap:wrap;gap:7px}
  .at .chips button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;min-height:44px}
  .at .chips button b{font-size:14px}
  .at .chips button small{font-size:11px;color:var(--muted)}
  .sugg .head{padding:8px 14px 6px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--gold);border-top:1px solid var(--line2);background:#21170f}
  .sugg .head:first-child{border-top:0}
  body{background:radial-gradient(700px 320px at 0 -100px,rgba(232,64,42,.25),transparent 70%),var(--bg)}
  header h1{color:var(--gold)}
  .lbl{color:var(--gold)}
  .card h3,.sub{color:var(--gold)}
  .save{box-shadow:0 5px 0 #a82a18}
  .save:active{transform:translateY(3px);box-shadow:0 2px 0 #a82a18}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./" aria-label="Tilbake til Kebabtesten"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 class="disp">NY TEST</h1>
    <img src="logo.svg" alt="" width="52" height="52" style="flex:0 0 auto">
  </header>

  <div class="msg info hidden" id="setup">Innleggingen er ikke koblet til regnearket ennå. Når mottakeren i regnearket er publisert, virker denne siden.</div>

  <form id="f" autocomplete="off" novalidate>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="placebox">
        <label class="lbl" for="sted">Sted</label>
        <div class="ac"><input type="text" id="sted" placeholder="Navnet på sjappa, eller start med adressen under" maxlength="80" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false"><div class="sugg hidden" id="sugg" role="listbox"></div></div>
        <div id="placeInfo" aria-live="polite"></div>
        <div id="addrWrap" style="margin-top:12px">
          <label class="lbl" for="adresse">Adresse</label>
          <div class="ac"><input type="text" id="adresse" placeholder="Søk etter gateadresse" maxlength="120" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="addrSugg" aria-expanded="false"><div class="sugg hidden" id="addrSugg" role="listbox"></div></div>
          <div class="hint">Forslag fra Kartverkets adresseregister. Velg riktig adresse, så blir den lik hver gang.</div>
          <div id="atAddr" aria-live="polite"></div>
        </div>
      </div>
      <div class="row2">
        <label><span class="lbl">Dato</span><input type="date" id="dato" required></label>
        <label><span class="lbl">Pris (kr)</span><input type="number" id="pris" inputmode="numeric" min="0" placeholder="149"></label>
      </div>

      <div><span class="lbl">Hva spiste dere?</span><div class="pills" data-group="hva"></div></div>
      <div><span class="lbl">Servert som</span><div class="pills" data-group="servert"></div></div>
      <div><span class="lbl">Brødtype</span><div class="pills even" data-group="brodtype"></div></div>
      <div><span class="lbl">Sterkhet</span><div class="chili" id="chili"></div></div>

      <div>
        <span class="lbl">Bilder</span>
        <div class="photos">
          <label class="photo" id="p-kebab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Kebaben<input type="file" accept="image/*" data-key="kebab"></label>
          <label class="photo" id="p-sjappa"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a2.7 2.7 0 01-5.3 0 2.7 2.7 0 01-5.4 0A2.7 2.7 0 014 11z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg>Kebabsjappa<input type="file" accept="image/*" data-key="sjappa"></label>
        </div>
      </div>

      <div>
        <span class="lbl">Testpersoner</span>
        <div id="testers" style="display:flex;flex-direction:column;gap:12px"></div>
        <div class="add" style="margin-top:12px">
          <input type="text" id="nyNavn" list="navn" placeholder="Navn på testperson" maxlength="40">
          <button type="button" id="leggTil">Legg til</button>
        </div>
        <datalist id="navn"></datalist>
        <div class="quick" id="quick"></div>
      </div>

      <label id="pinWrap"><span class="lbl">PIN-kode</span><input type="password" id="pin" inputmode="numeric" placeholder="Fås av Atle"></label>
      <div class="msg hidden" id="msg"></div>
    </div>
  </form>
</div>
<div class="bar"><div class="in"><button class="save" id="save" form="f" type="submit">Lagre test</button></div></div>

<script src="config.js"></script>
<script src="parse.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (tag, a = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(a)) { if (v == null) continue; if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); } kids.flat().forEach(c => c != null && n.append(c)); return n; };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const cfg = window.KTConfig || {};
  const fmt = v => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');

  const state = { hva: 'Vanlig kebab', servert: 'Pita', brodtype: '', sterkhet: 0, bilder: {}, testere: [] };
  const OPTS = { hva: ['Vanlig kebab', 'Kyllingkebab', 'Blandet', 'Falafel', 'Annet'], servert: ['Pita', 'Rull', 'Tallerken', 'Annet'], brodtype: ['Hjemmelaget', 'Butikkbrød'] };
  const CATS = [['kjott', 'Kjøtt'], ['saus', 'Saus'], ['fyll', 'Fyll / grønt'], ['porsjon', 'Porsjon'], ['verdi', 'Pris / verdi']];

  if (!cfg.SCRIPT_URL) $('#setup').classList.remove('hidden');
  if (cfg.NO_PIN || store.get('kt-pin')) $('#pinWrap').classList.add('hidden');
  $('#dato').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  // ----- pills -----
  document.querySelectorAll('.pills').forEach(box => {
    const g = box.dataset.group;
    const draw = () => box.replaceChildren(...OPTS[g].map(o => el('button', { type: 'button', class: 'pill' + (state[g] === o ? ' on' : ''), text: o, 'aria-pressed': String(state[g] === o), onclick: () => { state[g] = state[g] === o && g === 'brodtype' ? '' : o; draw(); } })));
    draw();
  });
  // ----- chili -----
  const drawChili = () => $('#chili').replaceChildren(...[1, 2, 3, 4, 5].map(n => {
    const b = el('button', { type: 'button', 'aria-label': `Sterkhet ${n} av 5`, onclick: () => { state.sterkhet = state.sterkhet === n ? 0 : n; drawChili(); } });
    b.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="${n <= state.sterkhet ? '#ff6a2b' : '#4a3a30'}" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`;
    return b;
  }));
  drawChili();

  // ----- photos (resized in the browser before upload) -----
  document.querySelectorAll('.photo input').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    const key = inp.dataset.key, box = inp.closest('.photo');
    try {
      const url = await resize(f, 1600, 0.82);
      state.bilder[key] = url;
      box.querySelectorAll('img,.x').forEach(n => n.remove());
      box.append(el('img', { src: url, alt: '' }), el('button', { type: 'button', class: 'x', 'aria-label': 'Fjern bilde', text: '×', onclick: e => { e.preventDefault(); delete state.bilder[key]; box.querySelectorAll('img,.x').forEach(n => n.remove()); inp.value = ''; } }));
    } catch { show('err', 'Klarte ikke å lese bildet. Prøv et annet.'); }
  }));
  function resize(file, max, q) {
    return new Promise((res, rej) => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q)); };
      img.onerror = () => { URL.revokeObjectURL(u); rej(); };
      img.src = u;
    });
  }

  // ----- testers -----
  let known = [];
  function addTester(name) {
    name = String(name || '').trim().slice(0, 40);
    if (!name || state.testere.some(t => t.navn.toLowerCase() === name.toLowerCase())) return;
    if (!state.testere.length) store.set('kt-me', name);
    state.testere.push({ navn: name, kjott: null, saus: null, fyll: null, porsjon: null, verdi: null, brod: null, kommentar: '' });
    drawTesters(); drawQuick();
  }
  const avg = a => { const x = a.filter(v => v != null); return x.length ? x.reduce((s, v) => s + v, 0) / x.length : null; };
  function drawTesters() {
    if (!state.testere.length) {
      $('#testers').replaceChildren(el('div', { class: 'tester empty-t' }, el('b', { text: 'Hvem testet?' }), el('div', { text: 'Trykk på navnet ditt under, eller skriv inn et nytt, så får du opp scorene for kjøtt, saus, fyll, porsjon, pris og brød.' })));
      return;
    }
    $('#testers').replaceChildren(...state.testere.map((t, i) => {
      const kebab = avg(CATS.map(([k]) => t[k]));
      const total = kebab != null && t.brod != null ? kebab * 0.8 + t.brod * 0.2 : (kebab ?? t.brod);
      const step = (k, label) => {
        const out = el('output', { class: t[k] == null ? 'empty' : '', text: t[k] == null ? '–' : String(t[k]) });
        const set = d => { t[k] = t[k] == null ? 5 + (d > 0 ? 1 : 0) : Math.min(10, Math.max(1, t[k] + d)); drawTesters(); };
        return el('div', { class: 'step' }, el('span', { text: label }), el('div', { class: 'ctl' },
          el('button', { type: 'button', 'aria-label': `${label} ned`, text: '−', onclick: () => set(-1) }), out,
          el('button', { type: 'button', 'aria-label': `${label} opp`, text: '+', onclick: () => set(1) })));
      };
      const note = el('input', { type: 'text', placeholder: 'Kommentar (valgfritt)', maxlength: '300', style: 'margin-top:10px' });
      note.value = t.kommentar; note.addEventListener('input', () => { t.kommentar = note.value; });
      return el('div', { class: 'tester' },
        el('div', { class: 'th' }, el('b', { text: t.navn }), el('span', { class: 'tot', text: fmt(total) })),
        el('div', { class: 'sub', text: 'KEBABEN' }), CATS.map(([k, l]) => step(k, l)),
        el('div', { class: 'sub', text: 'BRØDET' }), step('brod', 'Brød'),
        el('div', { class: 'sum' }, el('span', {}, 'Kebab ', el('b', { text: fmt(kebab) }), ' · brød ', el('b', { text: t.brod == null ? '–' : String(t.brod) })),
          el('button', { type: 'button', class: 'rm', text: 'Fjern', onclick: () => { state.testere.splice(i, 1); drawTesters(); drawQuick(); } })),
        note);
    }));
  }
  function drawQuick() {
    const left = known.filter(n => !state.testere.some(t => t.navn.toLowerCase() === n.toLowerCase()));
    $('#quick').replaceChildren(...left.map(n => el('button', { type: 'button', text: '+ ' + n, onclick: () => addTester(n) })));
  }
  drawTesters();
  $('#leggTil').addEventListener('click', () => { addTester($('#nyNavn').value); $('#nyNavn').value = ''; });
  $('#nyNavn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#leggTil').click(); } });

  // known names and places from the sheet
  (async () => {
    try {
      const base = `https://docs.google.com/spreadsheets/d/${cfg.SHEET_ID}/gviz/tq`;
      const table = await new Promise((resolve, reject) => {
        const cb = '__kt' + Date.now(), sc = document.createElement('script');
        const to = setTimeout(() => { sc.remove(); reject(); }, 10000);
        window[cb] = r => { clearTimeout(to); sc.remove(); delete window[cb]; r && r.table ? resolve(r.table) : reject(); };
        sc.onerror = () => { clearTimeout(to); reject(); };
        sc.src = `${base}?gid=0&headers=${cfg.HEADER_ROWS || 1}&tqx=out:json;responseHandler:${cb}`;
        document.head.append(sc);
      });
      const parsed = KTParse.parseRows(KTParse.gvizToRows(table));
      const tests = parsed.tests;
      knownPlaces = parsed.places || [];
      refreshPlace();
      const names = new Map(); tests.forEach(t => t.scores.forEach(s => names.set(s.name, (names.get(s.name) || 0) + 1)));
      known = [...names.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n).filter(n => n && n !== 'Anonym');
      $('#navn').replaceChildren(...known.map(n => el('option', { value: n })));
    } catch {}
    if (!known.length) known = ['Atle Conradsen', 'Itrat Zishan', 'Tobias Frost', 'Truls Blingø'];
    let me = null; try { me = localStorage.getItem('kt-me'); } catch {}
    if (me && !state.testere.length) addTester(me);
    drawQuick();
  })();

  // ----- sted: kjente steder, likhetssjekk og adresse -----
  let knownPlaces = [];
  const place = { mode: 'none', name: '', address: '', confirmedNew: false, similar: null };
  const stedIn = $('#sted'), sugg = $('#sugg'), addrIn = $('#adresse'), addrSugg = $('#addrSugg');
  function showList(box, input, items) {
    box.replaceChildren(...items);
    const open = items.length > 0;
    box.classList.toggle('hidden', !open); input.setAttribute('aria-expanded', String(open));
  }
  function choosePlace(p) {
    stedIn.value = p.name; place.confirmedNew = false; showList(sugg, stedIn, []); refreshPlace();
  }
  function refreshPlace() {
    const q = stedIn.value.trim();
    const info = $('#placeInfo');
    place.name = q; place.similar = null;
    if (!q) { place.mode = 'none'; info.replaceChildren(); $('#addrWrap').classList.remove('hidden'); return; }
    const exact = knownPlaces.find(p => KTParse.placeKey(p.name) === KTParse.placeKey(q));
    if (exact) {
      place.mode = 'known'; place.name = exact.name; place.address = exact.address || '';
      info.replaceChildren(el('div', { class: 'pinfo known' }, el('b', { text: '✓ ' + exact.name }), exact.address ? ' · ' + exact.address : ' · mangler adresse, legg den inn under'));
      $('#addrWrap').classList.toggle('hidden', !!exact.address);
      return;
    }
    const sim = place.confirmedNew ? null : knownPlaces.find(p => KTParse.similarPlace(p.name, q));
    if (sim) {
      place.mode = 'similar'; place.similar = sim;
      info.replaceChildren(el('div', { class: 'pinfo warn' }, 'Finnes allerede: ', el('b', { text: '«' + sim.name + '»' }), sim.address ? ' (' + sim.address + ')' : '', '. Er det samme sted?',
        el('div', { class: 'btns' },
          el('button', { type: 'button', class: 'pri', text: 'Ja, bruk ' + sim.name, onclick: () => choosePlace(sim) }),
          el('button', { type: 'button', text: 'Nei, det er et nytt sted', onclick: () => { place.confirmedNew = true; refreshPlace(); } }))));
      $('#addrWrap').classList.add('hidden');
      return;
    }
    place.mode = 'new'; place.address = '';
    info.replaceChildren(el('div', { class: 'pinfo new', text: 'Nytt sted. Legg inn adressen, så blir det enkelt å finne igjen.' }));
    $('#addrWrap').classList.remove('hidden');
  }
  const placeBtn = p => el('button', { type: 'button', role: 'option', onclick: () => choosePlace(p) }, el('b', { text: p.name }), el('small', { text: p.address || 'Adresse mangler' }));
  let brTimer = 0, brSeq = 0, brItems = [];
  function renderSugg() {
    const q = stedIn.value.trim(), k = KTParse.placeKey(q);
    const own = !q ? [] : knownPlaces.filter(p => KTParse.placeKey(p.name).includes(k) || KTParse.similarPlace(p.name, q)).slice(0, 5);
    const nodes = [];
    if (own.length) nodes.push(el('div', { class: 'head', text: 'DERE HAR TESTET' }), ...own.map(placeBtn));
    const fresh = brItems.filter(b => !knownPlaces.some(p => KTParse.similarPlace(p.name, b.name)));
    if (fresh.length) nodes.push(el('div', { class: 'head', text: 'FRA BRØNNØYSUNDREGISTRENE' }), ...fresh.map(b => el('button', { type: 'button', role: 'option', onclick: () => chooseBusiness(b) }, el('b', { text: b.name }), el('small', { text: b.address || '' }))));
    showList(sugg, stedIn, nodes);
  }
  stedIn.addEventListener('input', () => {
    place.confirmedNew = false;
    brItems = []; renderSugg(); refreshPlace(); checkNameAgainstAddress();
    clearTimeout(brTimer);
    const q = stedIn.value.trim();
    if (q.length < 3 || knownPlaces.some(p => KTParse.placeKey(p.name) === KTParse.placeKey(q))) return;
    brTimer = setTimeout(async () => {
      const seq = ++brSeq;
      try {
        const j = await brreg({ navn: q, naeringskode: '56', size: '8' });
        if (seq !== brSeq) return;
        brItems = (j._embedded?.underenheter || []).filter(u => !u.nedleggelsesdato).map(u => ({ name: pretty(u.navn), address: brAddr(u) }));
        if (document.activeElement === stedIn) renderSugg();
      } catch {}
    }, 400);
  });
  function chooseBusiness(b) {
    stedIn.value = b.name; place.confirmedNew = true;
    if (b.address) { addrIn.value = b.address; }
    showList(sugg, stedIn, []); refreshPlace(); checkNameAgainstAddress();
  }

  // ----- hvem holder til på adressen? Brønnøysund (næringskode 56 = servering) + OpenStreetMap -----
  const BRREG = 'https://data.brreg.no/enhetsregisteret/api/underenheter';
  async function brreg(params) {
    const qs = new URLSearchParams(params).toString();
    try {
      const r = await fetch(BRREG + '?' + qs, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) {
      if (!cfg.SCRIPT_URL) throw e; // reserve: hent via mottakeren i regnearket
      const r = await fetch(cfg.SCRIPT_URL + '?action=brreg&' + qs);
      return await r.json();
    }
  }
  const cap = w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
  const pretty = n => String(n || '').toLowerCase().replace(/\s+(as|asa|enk|da|ans|nuf|sa)\.?$/i, '').replace(/\s+/g, ' ').trim()
    .split(' ').map(w => w.split('-').map(cap).join('-')).join(' ');
  const brAddr = u => { const a = u.beliggenhetsadresse || {}; return [(a.adresse || []).join(' '), [a.postnummer, a.poststed ? cap(a.poststed.toLowerCase()) : ''].filter(Boolean).join(' ')].filter(Boolean).join(', '); };
  const streetKey = t => KTParse.placeKey(String(t || '').split(',')[0]);
  async function overpass(lat, lon) {
    const q = `[out:json][timeout:8];nwr(around:70,${lat},${lon})["amenity"~"fast_food|restaurant|cafe"]["name"];out tags 25;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q) });
    const j = await r.json();
    return (j.elements || []).map(e => e.tags || {});
  }
  let atFound = [], atSeq = 0;
  async function lookupAt(a) {
    const box = $('#atAddr'), seq = ++atSeq;
    atFound = [];
    box.replaceChildren(el('div', { class: 'hint', text: 'Sjekker hvem som holder til på adressen …' }));
    const [br, osm] = await Promise.allSettled([
      a.postnummer ? brreg({ 'beliggenhetsadresse.postnummer': a.postnummer, naeringskode: '56', size: '200' }) : Promise.resolve({}),
      a.lat ? overpass(a.lat, a.lon) : Promise.resolve([])
    ]);
    if (seq !== atSeq) return;
    const list = [];
    const add = (name, src, detail) => { if (name && !list.some(x => KTParse.similarPlace(x.name, name))) list.push({ name, src, detail }); };
    const gate = streetKey(a.gate);
    if (br.status === 'fulfilled') for (const u of (br.value._embedded?.underenheter || [])) {
      if (u.nedleggelsesdato) continue;
      const k = KTParse.placeKey((u.beliggenhetsadresse?.adresse || []).join(' '));
      if (k && gate && (k === gate || k.startsWith(gate) || gate.startsWith(k))) add(pretty(u.navn), 'Brønnøysundregistrene', u.naeringskode1?.beskrivelse || '');
    }
    if (osm.status === 'fulfilled') for (const t of osm.value) add(t.name, 'Kart', /kebab/i.test(t.cuisine || '') ? 'Kebab' : (t.amenity === 'fast_food' ? 'Gatekjøkken' : 'Servering'));
    atFound = list;
    if (br.status === 'rejected' && osm.status === 'rejected') { box.replaceChildren(); return; }
    if (!list.length) { box.replaceChildren(el('div', { class: 'hint', text: 'Fant ingen registrerte serveringssteder på adressen. Skriv navnet som det står på skiltet.' })); return; }
    checkNameAgainstAddress();
  }
  function checkNameAgainstAddress() {
    const box = $('#atAddr');
    if (!atFound.length || $('#addrWrap').classList.contains('hidden')) { if (!box.querySelector('.hint')) box.replaceChildren(); return; }
    const q = stedIn.value.trim();
    const match = q && atFound.find(f => KTParse.similarPlace(f.name, q));
    const chips = el('div', { class: 'chips' }, atFound.slice(0, 8).map(f => el('button', { type: 'button', onclick: () => { stedIn.value = f.name; place.confirmedNew = true; refreshPlace(); checkNameAgainstAddress(); } }, el('b', { text: f.name }), el('small', { text: [f.detail, f.src].filter(Boolean).join(' · ') }))));
    if (match && KTParse.placeKey(match.name) === KTParse.placeKey(q)) {
      box.replaceChildren(el('div', { class: 'at' }, el('p', { text: '✓ «' + match.name + '» er registrert på denne adressen.' })));
    } else if (match) {
      box.replaceChildren(el('div', { class: 'at warn' }, el('p', {}, 'Registrert navn er ', el('b', { text: '«' + match.name + '»' }), '. Trykk for å bruke det:'), chips));
    } else if (q) {
      box.replaceChildren(el('div', { class: 'at warn' }, el('p', {}, 'Fant ikke ', el('b', { text: '«' + q + '»' }), ' på denne adressen. Registrert her:'), chips));
    } else {
      box.replaceChildren(el('div', { class: 'at' }, el('p', { text: 'Serveringssteder på denne adressen. Trykk for å bruke navnet:' }), chips));
    }
  }

  stedIn.addEventListener('focus', () => { if (!stedIn.value.trim() && knownPlaces.length) showList(sugg, stedIn, knownPlaces.slice(0, 8).map(p => el('button', { type: 'button', role: 'option', onclick: () => choosePlace(p) }, el('b', { text: p.name }), el('small', { text: p.address || 'Adresse mangler' })))); });
  document.addEventListener('click', e => { if (!e.target.closest('.ac')) { showList(sugg, stedIn, []); showList(addrSugg, addrIn, []); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { showList(sugg, stedIn, []); showList(addrSugg, addrIn, []); } });

  // Adressesøk mot Kartverket (ws.geonorge.no). Faller tilbake til fritekst om det ikke svarer.
  let addrTimer = 0, addrSeq = 0;
  addrIn.addEventListener('input', () => {
    clearTimeout(addrTimer);
    const q = addrIn.value.trim();
    if (q.length < 3) { showList(addrSugg, addrIn, []); return; }
    addrTimer = setTimeout(async () => {
      const seq = ++addrSeq;
      try {
        const r = await fetch('https://ws.geonorge.no/adresser/v1/sok?' + new URLSearchParams({ sok: q, fuzzy: 'true', treffPerSide: '6', asciiKompatibel: 'false' }));
        const j = await r.json();
        if (seq !== addrSeq) return;
        const seen = new Set();
        const hits = (j.adresser || []).map(a => ({
          label: `${a.adressetekst}, ${a.postnummer} ${a.poststed ? a.poststed.charAt(0) + a.poststed.slice(1).toLowerCase() : ''}`.trim(),
          gate: a.adressetekst, postnummer: a.postnummer, lat: a.representasjonspunkt?.lat, lon: a.representasjonspunkt?.lon
        })).filter(h => !seen.has(h.label) && seen.add(h.label));
        showList(addrSugg, addrIn, hits.map(h => el('button', { type: 'button', role: 'option', onclick: () => { addrIn.value = h.label; showList(addrSugg, addrIn, []); lookupAt(h); } }, el('b', { text: h.label }))));
      } catch { showList(addrSugg, addrIn, []); }
    }, 280);
  });

  // ----- submit -----
  function show(kind, html) { const m = $('#msg'); m.className = 'msg ' + kind; m.innerHTML = html; m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    if (!cfg.SCRIPT_URL) return show('err', 'Innleggingen er ikke koblet til regnearket ennå.');
    refreshPlace();
    if (place.mode === 'none') return show('err', 'Skriv inn stedet.');
    if (place.mode === 'similar') return show('err', `Er «${stedIn.value.trim()}» det samme som «${place.similar.name}»? Velg ja eller nei under stedet.`);
    const sted = place.name;
    const adresse = (place.mode === 'known' && place.address) ? place.address : addrIn.value.trim();
    if (place.mode === 'new' && !adresse) return show('err', 'Legg inn adressen til det nye stedet.');
    if (!state.testere.length) return show('err', 'Legg til minst én testperson.');
    if (!state.testere.some(t => CATS.some(([k]) => t[k] != null) || t.brod != null)) return show('err', 'Gi minst én score.');
    const pin = $('#pin').value.trim() || store.get('kt-pin') || '';
    if (!pin && !cfg.NO_PIN) return show('err', 'Skriv inn PIN-koden.');
    const [y, m, d] = $('#dato').value.split('-');
    const body = {
      pin,
      test: { dato: d && m && y ? `${d}.${m}.${y}` : '', sted, adresse, hva: state.hva, servert: state.servert, pris: $('#pris').value, sterkhet: state.sterkhet || '', brodtype: state.brodtype },
      testere: state.testere.map(t => ({ ...t })),
      bildeKebab: state.bilder.kebab || '', bildeSjappa: state.bilder.sjappa || ''
    };
    const btn = $('#save'); btn.disabled = true; btn.textContent = 'Lagrer …';
    try {
      const r = await fetch(cfg.SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) {
        if (/PIN/i.test(j.feil || '')) { store.set('kt-pin', ''); $('#pinWrap').classList.remove('hidden'); }
        throw new Error(j.feil || 'Ukjent feil');
      }
      if (pin) store.set('kt-pin', pin);
      store.set('kt-me', state.testere[0].navn);
      $('#pinWrap').classList.add('hidden');
      show('ok', `Lagret! ${j.rader} ${j.rader === 1 ? 'rad' : 'rader'} lagt inn. Testen dukker opp på <a href="./">Kebabtesten</a> innen et minutt.`);
      btn.textContent = 'Lagret ✓';
      setTimeout(() => { location.href = './'; }, 2500);
    } catch (err) {
      show('err', 'Kunne ikke lagre: ' + String(err.message || err).replace(/[<>&]/g, ''));
      btn.disabled = false; btn.textContent = 'Lagre test';
    }
  });
})();
</script>
</body>
</html>
