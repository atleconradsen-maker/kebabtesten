<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legg inn test – Kebabtesten</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ff6a2b'/%3E%3Cpath d='M12 3v18M8 7h8l-1 3H9zM7 11.5h10l-1 3H8zM8 16h8l-1 2.5H9z' fill='none' stroke='%2315110f' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#15110f;--panel:#221b17;--panel2:#1d1714;--line:#3a2e27;--line2:#2e2520;--text:#f4ead8;--muted:#b9a995;--dim:#8d7c6a;--sauce:#ff6a2b;--sauce2:#ff7a3d;--gold:#ffb547}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  .disp{font-family:'Archivo Black',Impact,sans-serif;font-weight:400}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:20px}
  header{display:flex;align-items:center;gap:12px}
  .back{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);text-decoration:none;flex:0 0 auto}
  header h1{margin:0;font-size:24px;flex:1}
  .lbl{font-size:12px;font-weight:800;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;margin-bottom:7px;display:block}
  input[type=text],input[type=number],input[type=date],input[type=password],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
  input:focus,textarea:focus{outline:2px solid var(--sauce);outline-offset:0;border-color:transparent}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
  .pill.on{border-color:var(--sauce);background:rgba(255,106,43,.14);color:#ff9a6a}
  .chili{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 8px}
  .chili button{width:40px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
  .card h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--sauce2)}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .photo{position:relative;border:1.5px dashed #4a3a30;background:var(--panel2);border-radius:16px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;overflow:hidden}
  .photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;z-index:2;cursor:pointer}
  .tester{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
  .th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .th b{font-size:17px}
  .th .tot{font-family:'Archivo Black';font-size:26px;color:var(--sauce2)}
  .rm{background:none;border:0;color:var(--dim);font-size:13px;cursor:pointer;padding:8px}
  .sub{font-size:11px;font-weight:800;letter-spacing:1.1px;color:var(--muted);margin:10px 0 0}
  .step{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2)}
  .step:last-of-type{border-bottom:0}
  .step span{font-weight:600}
  .step .ctl{display:flex;align-items:center;gap:6px}
  .step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
  .step output{width:34px;text-align:center;font-family:'Archivo Black';font-size:21px;color:var(--gold)}
  .step output.empty{color:var(--dim)}
  .sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
  .sum b{color:var(--text)}
  .add{display:flex;gap:8px}
  .add input{flex:1}
  .add button{flex:0 0 auto;padding:0 18px;border-radius:12px;border:1px solid var(--sauce);background:transparent;color:var(--sauce2);font-weight:800;cursor:pointer}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick button{font-size:13px;padding:8px 12px;border-radius:999px;border:1px dashed var(--line);background:none;color:var(--muted);cursor:pointer}
  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px 18px}
  .bar .in{max-width:560px;margin:0 auto}
  .save{width:100%;padding:17px;border-radius:999px;border:0;background:var(--sauce);color:var(--bg);font-weight:800;font-size:17px;cursor:pointer}
  .save:disabled{opacity:.6;cursor:default}
  .msg{padding:13px 15px;border-radius:12px;font-size:14px;line-height:1.45}
  .msg.err{background:#3d1f1c;color:#ffb0a6}
  .msg.ok{background:#1f3322;color:#a8eaa3}
  .msg.info{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .msg a{color:inherit;font-weight:800}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./" aria-label="Tilbake til Kebabtesten"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 class="disp">NY TEST</h1>
  </header>

  <div class="msg info hidden" id="setup">Innleggingen er ikke koblet til regnearket ennå. Når mottakeren i regnearket er publisert, virker denne siden.</div>

  <form id="f" autocomplete="off" novalidate>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="row2">
        <label><span class="lbl">Dato</span><input type="date" id="dato" required></label>
        <label><span class="lbl">Pris (kr)</span><input type="number" id="pris" inputmode="numeric" min="0" placeholder="149"></label>
      </div>
      <label><span class="lbl">Sted</span><input type="text" id="sted" list="steder" placeholder="F.eks. Smakfull Kebab" required maxlength="80"></label>
      <datalist id="steder"></datalist>

      <div><span class="lbl">Hva spiste dere?</span><div class="pills" data-group="hva"></div></div>
      <div><span class="lbl">Servert som</span><div class="pills" data-group="servert"></div></div>
      <div class="row2">
        <div><span class="lbl">Brødtype</span><div class="pills" data-group="brodtype"></div></div>
        <div><span class="lbl">Sterkhet</span><div class="chili" id="chili"></div></div>
      </div>

      <div>
        <span class="lbl">Bilder</span>
        <div class="photos">
          <label class="photo" id="p-kebab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Kebaben<input type="file" accept="image/*" data-key="kebab"></label>
          <label class="photo" id="p-sjappa"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a2.7 2.7 0 01-5.3 0 2.7 2.7 0 01-5.4 0A2.7 2.7 0 014 11z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg>Kebabsjappa<input type="file" accept="image/*" data-key="sjappa"></label>
        </div>
      </div>

      <div>
        <span class="lbl">Testpersoner</span>
        <div id="testers" style="display:flex;flex-direction:column;gap:12px"></div>
        <div class="add" style="margin-top:12px">
          <input type="text" id="nyNavn" list="navn" placeholder="Navn på testperson" maxlength="40">
          <button type="button" id="leggTil">Legg til</button>
        </div>
        <datalist id="navn"></datalist>
        <div class="quick" id="quick"></div>
      </div>

      <label id="pinWrap"><span class="lbl">PIN-kode</span><input type="password" id="pin" inputmode="numeric" placeholder="Fås av Atle"></label>
      <div class="msg hidden" id="msg"></div>
    </div>
  </form>
</div>
<div class="bar"><div class="in"><button class="save" id="save" form="f" type="submit">Lagre test</button></div></div>

<script src="config.js"></script>
<script src="parse.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (tag, a = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(a)) { if (v == null) continue; if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); } kids.flat().forEach(c => c != null && n.append(c)); return n; };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const cfg = window.KTConfig || {};
  const fmt = v => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');

  const state = { hva: 'Vanlig kebab', servert: 'Pita', brodtype: '', sterkhet: 0, bilder: {}, testere: [] };
  const OPTS = { hva: ['Vanlig kebab', 'Kyllingkebab', 'Blandet', 'Falafel', 'Annet'], servert: ['Pita', 'Rull', 'Tallerken', 'Annet'], brodtype: ['Hjemmelaget', 'Butikkbrød'] };
  const CATS = [['kjott', 'Kjøtt'], ['saus', 'Saus'], ['fyll', 'Fyll / grønt'], ['porsjon', 'Porsjon'], ['verdi', 'Pris / verdi']];

  if (!cfg.SCRIPT_URL) $('#setup').classList.remove('hidden');
  if (store.get('kt-pin')) $('#pinWrap').classList.add('hidden');
  $('#dato').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  // ----- pills -----
  document.querySelectorAll('.pills').forEach(box => {
    const g = box.dataset.group;
    const draw = () => box.replaceChildren(...OPTS[g].map(o => el('button', { type: 'button', class: 'pill' + (state[g] === o ? ' on' : ''), text: o, 'aria-pressed': String(state[g] === o), onclick: () => { state[g] = state[g] === o && g === 'brodtype' ? '' : o; draw(); } })));
    draw();
  });
  // ----- chili -----
  const drawChili = () => $('#chili').replaceChildren(...[1, 2, 3, 4, 5].map(n => {
    const b = el('button', { type: 'button', 'aria-label': `Sterkhet ${n} av 5`, onclick: () => { state.sterkhet = state.sterkhet === n ? 0 : n; drawChili(); } });
    b.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="${n <= state.sterkhet ? '#ff6a2b' : '#4a3a30'}" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`;
    return b;
  }));
  drawChili();

  // ----- photos (resized in the browser before upload) -----
  document.querySelectorAll('.photo input').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    const key = inp.dataset.key, box = inp.closest('.photo');
    try {
      const url = await resize(f, 1600, 0.82);
      state.bilder[key] = url;
      box.querySelectorAll('img,.x').forEach(n => n.remove());
      box.append(el('img', { src: url, alt: '' }), el('button', { type: 'button', class: 'x', 'aria-label': 'Fjern bilde', text: '×', onclick: e => { e.preventDefault(); delete state.bilder[key]; box.querySelectorAll('img,.x').forEach(n => n.remove()); inp.value = ''; } }));
    } catch { show('err', 'Klarte ikke å lese bildet. Prøv et annet.'); }
  }));
  function resize(file, max, q) {
    return new Promise((res, rej) => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q)); };
      img.onerror = () => { URL.revokeObjectURL(u); rej(); };
      img.src = u;
    });
  }

  // ----- testers -----
  let known = [];
  function addTester(name) {
    name = String(name || '').trim().slice(0, 40);
    if (!name || state.testere.some(t => t.navn.toLowerCase() === name.toLowerCase())) return;
    state.testere.push({ navn: name, kjott: null, saus: null, fyll: null, porsjon: null, verdi: null, brod: null, kommentar: '' });
    drawTesters(); drawQuick();
  }
  const avg = a => { const x = a.filter(v => v != null); return x.length ? x.reduce((s, v) => s + v, 0) / x.length : null; };
  function drawTesters() {
    $('#testers').replaceChildren(...state.testere.map((t, i) => {
      const kebab = avg(CATS.map(([k]) => t[k]));
      const total = kebab != null && t.brod != null ? kebab * 0.8 + t.brod * 0.2 : (kebab ?? t.brod);
      const step = (k, label) => {
        const out = el('output', { class: t[k] == null ? 'empty' : '', text: t[k] == null ? '–' : String(t[k]) });
        const set = d => { t[k] = t[k] == null ? 5 + (d > 0 ? 1 : 0) : Math.min(10, Math.max(1, t[k] + d)); drawTesters(); };
        return el('div', { class: 'step' }, el('span', { text: label }), el('div', { class: 'ctl' },
          el('button', { type: 'button', 'aria-label': `${label} ned`, text: '−', onclick: () => set(-1) }), out,
          el('button', { type: 'button', 'aria-label': `${label} opp`, text: '+', onclick: () => set(1) })));
      };
      const note = el('input', { type: 'text', placeholder: 'Kommentar (valgfritt)', maxlength: '300', style: 'margin-top:10px' });
      note.value = t.kommentar; note.addEventListener('input', () => { t.kommentar = note.value; });
      return el('div', { class: 'tester' },
        el('div', { class: 'th' }, el('b', { text: t.navn }), el('span', { class: 'tot', text: fmt(total) })),
        el('div', { class: 'sub', text: 'KEBABEN' }), CATS.map(([k, l]) => step(k, l)),
        el('div', { class: 'sub', text: 'BRØDET' }), step('brod', 'Brød'),
        el('div', { class: 'sum' }, el('span', {}, 'Kebab ', el('b', { text: fmt(kebab) }), ' · brød ', el('b', { text: t.brod == null ? '–' : String(t.brod) })),
          el('button', { type: 'button', class: 'rm', text: 'Fjern', onclick: () => { state.testere.splice(i, 1); drawTesters(); drawQuick(); } })),
        note);
    }));
  }
  function drawQuick() {
    const left = known.filter(n => !state.testere.some(t => t.navn.toLowerCase() === n.toLowerCase()));
    $('#quick').replaceChildren(...left.map(n => el('button', { type: 'button', text: '+ ' + n, onclick: () => addTester(n) })));
  }
  $('#leggTil').addEventListener('click', () => { addTester($('#nyNavn').value); $('#nyNavn').value = ''; });
  $('#nyNavn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#leggTil').click(); } });

  // known names and places from the sheet
  (async () => {
    try {
      const base = `https://docs.google.com/spreadsheets/d/${cfg.SHEET_ID}/gviz/tq`;
      const table = await new Promise((resolve, reject) => {
        const cb = '__kt' + Date.now(), sc = document.createElement('script');
        const to = setTimeout(() => { sc.remove(); reject(); }, 10000);
        window[cb] = r => { clearTimeout(to); sc.remove(); delete window[cb]; r && r.table ? resolve(r.table) : reject(); };
        sc.onerror = () => { clearTimeout(to); reject(); };
        sc.src = `${base}?gid=0&headers=${cfg.HEADER_ROWS || 1}&tqx=out:json;responseHandler:${cb}`;
        document.head.append(sc);
      });
      const { tests } = KTParse.parseRows(KTParse.gvizToRows(table));
      const names = new Map(); tests.forEach(t => t.scores.forEach(s => names.set(s.name, (names.get(s.name) || 0) + 1)));
      known = [...names.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n).filter(n => n && n !== 'Anonym');
      $('#navn').replaceChildren(...known.map(n => el('option', { value: n })));
      $('#steder').replaceChildren(...[...new Set(tests.map(t => t.place))].map(p => el('option', { value: p })));
    } catch {}
    if (!known.length) known = ['Atle Conradsen', 'Itrat Zishan', 'Tobias Frost', 'Truls Blingø'];
    drawQuick();
  })();

  // ----- submit -----
  function show(kind, html) { const m = $('#msg'); m.className = 'msg ' + kind; m.innerHTML = html; m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    if (!cfg.SCRIPT_URL) return show('err', 'Innleggingen er ikke koblet til regnearket ennå.');
    const sted = $('#sted').value.trim();
    if (!sted) return show('err', 'Skriv inn stedet.');
    if (!state.testere.length) return show('err', 'Legg til minst én testperson.');
    if (!state.testere.some(t => CATS.some(([k]) => t[k] != null) || t.brod != null)) return show('err', 'Gi minst én score.');
    const pin = store.get('kt-pin') || $('#pin').value.trim();
    if (!pin) return show('err', 'Skriv inn PIN-koden.');
    const [y, m, d] = $('#dato').value.split('-');
    const body = {
      pin,
      test: { dato: d && m && y ? `${d}.${m}.${y}` : '', sted, hva: state.hva, servert: state.servert, pris: $('#pris').value, sterkhet: state.sterkhet || '', brodtype: state.brodtype },
      testere: state.testere.map(t => ({ ...t })),
      bildeKebab: state.bilder.kebab || '', bildeSjappa: state.bilder.sjappa || ''
    };
    const btn = $('#save'); btn.disabled = true; btn.textContent = 'Lagrer …';
    try {
      const r = await fetch(cfg.SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) {
        if (/PIN/i.test(j.feil || '')) { store.set('kt-pin', ''); $('#pinWrap').classList.remove('hidden'); }
        throw new Error(j.feil || 'Ukjent feil');
      }
      store.set('kt-pin', pin);
      $('#pinWrap').classList.add('hidden');
      show('ok', `Lagret! ${j.rader} ${j.rader === 1 ? 'rad' : 'rader'} lagt inn. Testen dukker opp på <a href="./">Kebabtesten</a> innen et minutt.`);
      btn.textContent = 'Lagret ✓';
      setTimeout(() => { location.href = './'; }, 2500);
    } catch (err) {
      show('err', 'Kunne ikke lagre: ' + String(err.message || err).replace(/[<>&]/g, ''));
      btn.disabled = false; btn.textContent = 'Lagre test';
    }
  });
})();
</script>
</body>
</html>
