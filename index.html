<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Kebabtesten – Norges mest uoffisielle kebabliga</title>
<meta name="description" content="Norges mest uoffisielle kebabliga. Vi tester kebab, gir poeng og kårer den beste baben.">
<meta property="og:title" content="Kebabtesten – Norges mest uoffisielle kebabliga">
<meta property="og:description" content="Vi tester. Dere stemmer. Den beste baben vinner.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kebabtesten">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#171717;--panel:#222;--panel2:#1d1d1d;--line:#333;--line2:#2a2a2a;--text:#F5F0E7;--muted:#b3ac9f;--dim:#8a8378;--gold:#F5B632;--chili:#D94B35;--green:#647C55;--green2:#8fb07a;--bread:#e2b77a;--r:18px;--nav:76px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
  a{color:var(--gold);text-decoration:none} button,input,select{font:inherit;color:inherit}
  .disp{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.2px}
  .hidden{display:none!important}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* topp og bunnmeny */
  .top{position:sticky;top:0;z-index:30;background:rgba(23,23,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .top{padding-top:env(safe-area-inset-top)}
  .top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);flex:1;min-width:0}
  .brand img{width:40px;height:40px;flex:0 0 auto}
  .brand span{font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.5px}
  .brand span b{font-weight:400;color:var(--gold)}
  .toplink{color:var(--text);font-size:13px;font-weight:700;padding:12px 8px}
  .meBtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);color:#171717;font-family:Anton,sans-serif;font-size:17px;cursor:pointer;flex:0 0 auto}
  .meBtn.anon{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#111;border-top:1px solid #2c2c2c;padding-bottom:env(safe-area-inset-bottom)}
  nav.bnav .in{max-width:720px;margin:0 auto;height:var(--nav);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding-top:8px}
  nav.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;min-height:48px}
  nav.bnav a.on{color:var(--gold)}
  nav.bnav a.plus{justify-self:center;margin-top:-26px;width:62px;height:62px;border-radius:50%;background:var(--gold);color:#171717;display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg);padding:0}
  nav.bnav a.plus:active{transform:scale(.95)}

  .status{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:var(--panel);color:var(--muted);font-size:14px}
  .kick{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .lbl{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .ksub{font-size:12px;color:var(--muted);margin-top:2px}
  .h1{margin:8px 0 0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(44px,12vw,64px);line-height:.95;text-transform:uppercase}
  .h1 em{font-style:normal;color:var(--gold)}
  .lead{margin:12px 0 0;font-size:15px;line-height:1.45;color:#cfc8bb}
  .sec{margin:30px 0 0}
  .sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sech h2{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:28px;line-height:1}
  .sech a,.sech button.linkbtn{font-size:13px;font-weight:700;padding:10px 0}
  .empty{text-align:center;color:var(--muted);padding:36px 18px;border:1px dashed var(--line);border-radius:var(--r);line-height:1.5}
  .empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

  .cta{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:16px;background:var(--gold);color:#171717;font-family:Anton,sans-serif;font-size:22px;letter-spacing:.5px;box-shadow:0 4px 0 #b9831c}
  .cta:active{transform:translateY(2px);box-shadow:0 2px 0 #b9831c}
  .btn2{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:1px solid #3a3a3a;background:transparent;color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
  .btnL{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:0;background:var(--text);color:#171717;font-weight:800;font-size:14px;cursor:pointer}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--panel);border-radius:14px;padding:4px}
  .seg button{height:40px;border:0;border-radius:10px;background:transparent;color:#cfc8bb;font-weight:600;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--text);color:#171717;font-weight:700}
  .chipsRow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .chipsRow::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
  .pill.on{background:var(--gold);border-color:var(--gold);color:#171717;font-weight:700}
  .search{display:flex;align-items:center;gap:10px;height:50px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;flex:1;min-width:0}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px;font-weight:500}
  .search input::placeholder{color:var(--dim)}
  .linkbtn{background:none;border:0;padding:0;color:var(--gold);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}

  /* forside */
  .hero{position:relative;display:block;margin-top:18px;height:min(86vw,420px);border-radius:24px;background:var(--chili);overflow:hidden;color:var(--text)}
  .hero .stripes{position:absolute;inset:0;background:repeating-linear-gradient(-35deg,rgba(0,0,0,.07) 0 18px,transparent 18px 36px)}
  .hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 35%,transparent 50%,rgba(0,0,0,.7))}
  .hero .illu{position:absolute;inset:0;width:100%;height:100%}
  .tagS{position:absolute;left:14px;top:14px;background:#171717;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.5px;padding:8px 10px;border-radius:10px}
  .stamp{width:88px;height:88px;border-radius:50%;background:var(--gold);color:#171717;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);flex:0 0 auto}
  .stamp b{font-family:Anton,sans-serif;font-weight:400;font-size:36px;line-height:1}
  .stamp small{font-size:9px;font-weight:800;letter-spacing:.8px;text-align:center;line-height:1.2}
  .hero .stamp{position:absolute;right:14px;bottom:14px}
  .hero .hname{position:absolute;left:16px;bottom:16px;right:116px}
  .hero .hname b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:30px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.3);text-transform:uppercase}
  .hero .hname span{display:block;font-size:12px;font-weight:600;margin-top:5px}
  .stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
  .stat{background:var(--panel);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:28px;color:var(--gold);line-height:1.1}
  .stat span{font-size:11px;color:var(--muted);font-weight:600}
  .hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory}
  .hscroll::-webkit-scrollbar{display:none}
  .tcard{flex:0 0 240px;scroll-snap-align:start;background:var(--panel);border-radius:18px;overflow:hidden;color:var(--text);display:flex;flex-direction:column}
  .pic{position:relative;height:140px;background:#3a2418;overflow:hidden}
  .pic.ph{background:repeating-linear-gradient(-35deg,#2a2a2a 0 14px,#262626 14px 28px)}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pic .sc{position:absolute;right:10px;top:10px;background:var(--gold);color:#171717;border-radius:12px;padding:6px 9px;font-family:Anton,sans-serif;font-size:20px;line-height:1}
  .pic .ty{position:absolute;left:10px;top:10px;background:rgba(23,23,23,.85);border-radius:8px;padding:4px 7px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
  .pic .dt{position:absolute;left:10px;bottom:8px;font-size:10px;font-weight:700;color:rgba(245,240,231,.9);text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .pic.ph .ico{position:absolute;inset:0;display:grid;place-items:center;color:#4a4a4a}
  .tbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
  .tbody b{font-family:Anton,sans-serif;font-weight:400;font-size:19px;line-height:1.1}
  .meter{display:flex;gap:3px;margin-top:8px}
  .meter i{display:block;flex:1 1 0;max-width:14px;min-width:0;height:6px;border-radius:3px;background:#3a3a3a;overflow:hidden}
  .meter i u{display:block;height:100%;background:var(--gold)}
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{border-radius:18px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:var(--text);text-align:left;border:0;cursor:pointer}
  .tile .t1{font-size:11px;font-weight:800;letter-spacing:1.5px}
  .tile .t2{font-family:Anton,sans-serif;font-size:20px;line-height:1.05;text-transform:uppercase}
  .tile .t3{font-size:12px;margin-top:4px;opacity:.92}
  .tile.c0{background:var(--gold);color:#171717}.tile.c1{background:var(--green)}.tile.c2{background:var(--chili)}.tile.c3{background:var(--panel)}
  .tile.none{opacity:.55}

  /* kåringer (gjenbrukt) */
  .awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
  .award{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;position:relative}
  .award .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .award .who{font-size:17px;font-weight:800;margin-top:2px}
  .award .sub{font-size:12px;color:var(--muted)}
  .award.folk .avs{display:flex;margin:-2px -2px 0 0}
  .award.folk .av{width:40px;height:40px;font-size:15px;border:2px solid var(--panel);cursor:pointer;margin-left:-10px}
  .award.folk .av:first-child{margin-left:0}
  .award.champ{border:2px solid var(--gold);background:linear-gradient(135deg,rgba(245,182,50,.16),rgba(217,75,53,.06))}
  .award.champ.year{border-color:var(--chili)}
  .cm-name{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--text);cursor:pointer}
  .cm-name:hover{color:var(--gold)}
  .cm-name.big{font-family:Anton,sans-serif;font-weight:400;font-size:24px;line-height:1.1}
  .av{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#171717;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:17px;flex:0 0 auto;border:0;cursor:pointer}
  .infobtn{margin-top:10px;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:16px;border:1px dashed var(--gold);background:rgba(245,182,50,.06);color:var(--text);font:inherit;cursor:pointer;min-height:56px}
  .infobtn>span:first-child{font-size:24px}
  .infobtn b{display:block}.infobtn small{color:var(--muted);font-size:12px}
  .infobtn .arr{margin-left:auto;font-size:26px;color:var(--gold)}

  /* kommentarer og anmeldelser */
  .cmts,.revs{display:flex;flex-direction:column;gap:8px}
  .cmt,.rev{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-radius:16px;padding:12px 14px}
  .rev{align-items:center}
  .cmt .av,.rev .av{width:40px;height:40px;font-size:16px}
  .cm-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .cm-t{margin:4px 0 0;color:#e7dfd1;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
  .rnote{margin-top:4px;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .like{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;min-height:50px;justify-content:center;border-radius:14px;border:1px solid #3a3a3a;background:var(--bg);color:var(--muted);cursor:pointer;font-size:18px}
  .like b{font-size:13px;color:var(--text)}
  .like.on{border-color:var(--gold);background:rgba(245,182,50,.14)}
  .like.on b{color:var(--gold)}
  .like:active{transform:scale(.94)}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--line2);color:var(--muted)}
  .chip b{color:var(--text)}
  .rchip{cursor:pointer;font:inherit;font-size:12px;min-height:34px;border:1px solid transparent}
  .rchip.on{border-color:var(--gold);background:rgba(245,182,50,.14)}
  .rchip.on .rl{color:var(--gold)}

  /* liga */
  .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-top:18px}
  .pod{background:var(--panel);border-radius:16px 16px 8px 8px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;color:var(--text);position:relative;min-width:0}
  .pod .pn{font-family:Anton,sans-serif;font-size:30px;line-height:1;color:#cfc8bb}
  .pod .pname{font-family:Anton,sans-serif;font-size:15px;line-height:1.1;margin-top:8px;text-transform:uppercase;overflow-wrap:anywhere}
  .pod .pm{font-size:11px;color:var(--muted);margin-top:4px}
  .pod.p1{background:var(--gold);color:#171717;height:196px}
  .pod.p1 .pn{color:#171717;font-size:42px}.pod.p1 .pm{color:#171717;font-weight:700}
  .pod.p2{height:156px}.pod.p3{height:130px}.pod.p3 .pn{color:#c58a5a}
  .crown{position:absolute;top:14px;left:50%;transform:translateX(-50%)}
  .ltable{margin-top:16px;background:var(--panel);border-radius:18px;overflow:hidden}
  .lrow{display:grid;grid-template-columns:38px minmax(0,1fr) 56px 60px;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line2);color:var(--text);min-height:58px}
  .lrow.head{border-top:0;font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--muted);min-height:0;padding:10px 14px}
  .lpos{display:flex;flex-direction:column;line-height:1}
  .lpos b{font-family:Anton,sans-serif;font-weight:400;font-size:20px}
  .lpos small{font-size:10px;font-weight:800;margin-top:3px}
  .mv-up{color:var(--green2)}.mv-down{color:#e8735f}.mv-same{color:var(--dim)}.mv-new{color:var(--gold)}
  .lname{min-width:0}
  .lname b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lname small{font-size:11px;color:var(--muted)}
  .lnum{text-align:center;font-size:13px;font-weight:700;color:#cfc8bb}
  .lsc{justify-self:end;background:var(--bg);border:1px solid #3a3a3a;border-radius:10px;padding:5px 8px;font-family:Anton,sans-serif;font-size:18px;color:var(--gold)}
  .divider{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
  .divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}
  .uq{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px dashed #3a3a3a;border-radius:14px;padding:12px 14px;color:var(--text);margin-bottom:8px}
  .uq b{font-size:14px}.uq .s{font-family:Anton,sans-serif;font-size:18px;color:var(--muted);margin-left:auto}
  .note{margin-top:16px;background:#2a2418;border:1px solid #4a3d1d;border-radius:16px;padding:14px 16px;display:flex;gap:12px;font-size:13px;line-height:1.45;color:#e7dcc6}

  /* kart */
  body.v-kart .wrap{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
  .kartwrap{position:relative;margin:0 -16px;height:calc(100vh - 62px - var(--nav) - env(safe-area-inset-bottom) - env(safe-area-inset-top));height:calc(100dvh - 62px - var(--nav) - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:420px;overflow:hidden}
  #kmap{position:absolute;inset:0;background:#1e2120}
  .kover{position:absolute;left:12px;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:10px;pointer-events:none}
  .kover>*{pointer-events:auto}
  .kover .search{background:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .kover .pill{background:var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .kover .pill.on{background:var(--text);border-color:var(--text);color:#171717}
  .kover .chipsRow{margin:0 -12px;padding:0 12px}
  .nearBtn{width:50px;height:50px;border-radius:14px;border:0;background:var(--gold);color:#171717;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer;flex:0 0 auto}
  .ksheet{position:absolute;left:10px;right:10px;bottom:12px;z-index:500;background:var(--panel);border-radius:22px;padding:8px 16px 16px;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  .ksheet .grab{width:40px;height:5px;border-radius:3px;background:#444;margin:0 auto 12px}
  .ksheet .krow{display:flex;gap:14px;align-items:center}
  .ksheet .kimg{width:72px;height:72px;border-radius:16px;background:#3a2418;flex:0 0 auto;overflow:hidden;position:relative}
  .ksheet .kimg img{width:100%;height:100%;object-fit:cover}
  .ksheet .kname{font-family:Anton,sans-serif;font-size:24px;line-height:1.05;margin-top:3px;text-transform:uppercase}
  .ksheet .stamp{width:60px;height:60px;transform:none}.ksheet .stamp b{font-size:24px}
  .kbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
  .kpin{display:inline-block;border:2px solid #171717;border-radius:12px;padding:4px 8px;font:400 16px/1 Anton,Impact,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.5);white-space:nowrap;transform:translate(-50%,-100%);position:relative;cursor:pointer}
  .kpin:after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #171717}
  .kpin.top{font-size:22px;background:var(--gold);color:#171717}
  .kpin.sel{outline:3px solid var(--text)}
  .leaflet-container{font-family:Inter,system-ui,sans-serif;background:#1e2120}
  .kt-tiles{filter:invert(1) hue-rotate(180deg) brightness(.75) contrast(.9) saturate(.4)}

  /* alle tester */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,240px),1fr));gap:10px;margin-top:16px}
  .tgrid .tcard{flex:none}
  .tgrid .pic{height:150px}
  .tgrid .tbody b{font-size:17px}
  .likesm{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11px;font-weight:700;color:#cfc8bb}

  /* restaurantside */

  // ---------- data ----------
  async function fetchData() {
    const id = (window.KTConfig || {}).SHEET_ID;
    const base = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq`;
    const HEAD = (window.KTConfig || {}).HEADER_ROWS || 1;
    try {
      const table = await new Promise((resolve, reject) => {
        const cb = '__kt' + Date.now();
        const sc = document.createElement('script');
        const done = () => { delete window[cb]; sc.remove(); clearTimeout(to); };
        const to = setTimeout(() => { done(); reject(new Error('timeout')); }, 12000);
        window[cb] = res => { done(); res && res.status !== 'error' && res.table ? resolve(res.table) : reject(new Error('gviz')); };
        sc.onerror = () => { done(); reject(new Error('load')); };
        sc.src = `${base}?gid=0&headers=${HEAD}&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
        document.head.append(sc);
      });
      return KTParse.parseRows(KTParse.gvizToRows(table));
    } catch (e) {
      const r = await fetch(`${base}?tqx=out:csv&gid=0&headers=${HEAD}&_=${Date.now()}`);
