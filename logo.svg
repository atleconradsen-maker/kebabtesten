<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Kebabtesten">
  <defs>
    <linearGradient id="kt-meat" x1="0" x2="1">
      <stop offset="0" stop-color="#7a2e12"/><stop offset=".45" stop-color="#c0612b"/><stop offset=".7" stop-color="#a94a1f"/><stop offset="1" stop-color="#6b250e"/>
    </linearGradient>
    <linearGradient id="kt-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8402a"/><stop offset=".55" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffc629"/>
    </linearGradient>
    <path id="kt-top" d="M 38 120 A 82 82 0 0 1 202 120"/>
    <path id="kt-bot" d="M 22 120 A 98 98 0 0 0 218 120"/>
  </defs>
  <!-- badge -->
  <circle cx="120" cy="120" r="116" fill="#e8402a"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#fff4e0" stroke-width="3"/>
  <circle cx="120" cy="120" r="70" fill="#17110e"/>
  <circle cx="120" cy="120" r="70" fill="none" stroke="#ffc629" stroke-width="4"/>
  <!-- arc text -->
  <text font-family="'Archivo Black', Impact, 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff4e0" letter-spacing="2.5" text-anchor="middle"><textPath href="#kt-top" startOffset="50%">KEBABTESTEN</textPath></text>
  <text font-family="'Archivo Black', Impact, 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffc629" letter-spacing="3" text-anchor="middle"><textPath href="#kt-bot" startOffset="50%">★ KJØTT · SAUS · BRØD ★</textPath></text>
  <!-- flames -->
  <path d="M90 178 C 82 166, 88 154, 97 148 C 96 157, 101 160, 104 156 C 101 145, 108 135, 116 128 C 116 140, 124 144, 126 152 C 129 149, 130 144, 129 139 C 140 148, 146 164, 140 178 Z" fill="url(#kt-flame)"/>
  <path d="M108 180 C 101 172, 106 162, 113 158 C 113 164, 117 166, 119 163 C 118 155, 123 150, 128 146 C 128 154, 134 158, 135 164 C 138 162, 138 159, 137 156 C 145 164, 146 174, 141 180 Z" fill="url(#kt-flame)" opacity=".85" transform="translate(4 0)"/>
  <!-- spit -->
  <rect x="118" y="56" width="4" height="122" rx="2" fill="#fff4e0"/>
  <circle cx="120" cy="56" r="5" fill="#ffc629"/>
  <!-- doner cone -->
  <path d="M95 70 h50 l-9 84 h-32z" fill="url(#kt-meat)"/>
  <g stroke="#4a1a08" stroke-width="2.2" stroke-linecap="round" opacity=".55">
    <path d="M97 82 h46"/><path d="M98 96 h44"/><path d="M100 110 h40"/><path d="M101 124 h38"/><path d="M103 138 h34"/>
  </g>
  <path d="M137 72 l-8 80" stroke="#ffb36b" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <rect x="93" y="66" width="54" height="7" rx="3" fill="#fff4e0"/>
  <rect x="102" y="152" width="36" height="6" rx="3" fill="#fff4e0"/>
  <!-- tiny stars -->
  <circle cx="26" cy="120" r="3.5" fill="#ffc629"/><circle cx="214" cy="120" r="3.5" fill="#ffc629"/>
</svg>
